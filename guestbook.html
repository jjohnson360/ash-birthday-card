<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook — Happy Birthday Ash</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{ max-width: 620px; margin: 0 auto; padding: 50px 20px 60px; }
  .header{ text-align:center; margin-bottom: 30px; }
  .header h1{ font-size: clamp(26px, 6vw, 38px); color: var(--pink-deep); margin:0 0 6px; }
  .header .sub{ font-family:'Space Mono', monospace; font-size:12.5px; letter-spacing:1.5px; color: var(--ink-soft); }

  .form-card{
    background: var(--panel); border-radius: 20px; padding: 26px 22px;
    box-shadow: 0 14px 34px rgba(120,20,55,0.14); margin-bottom: 34px;
  }
  .form-card label{ display:block; font-size:13px; font-weight:600; color: var(--ink-soft); margin: 12px 0 5px; }
  .form-card input, .form-card textarea{
    width:100%; border: 1.5px solid rgba(214,68,107,0.25); border-radius: 12px;
    padding: 10px 12px; font-family:'Baloo 2', sans-serif; font-size:14.5px; color: var(--ink);
    background:#fff; resize: vertical;
  }
  .form-card textarea{ min-height: 90px; }
  .form-actions{ text-align:center; margin-top: 18px; }

  .notes-wall{ display:flex; flex-direction:column; gap: 14px; }
  .note{
    background: var(--panel); border-radius:16px; padding: 16px 18px;
    box-shadow: 0 8px 20px rgba(120,20,55,0.10);
  }
  .note .who{ font-weight:700; color: var(--pink-deep); font-size:14px; margin-bottom:4px; }
  .note .what{ font-size: 14.5px; line-height:1.5; color: var(--ink); white-space: pre-wrap; }
  .empty-note{
    text-align:center; color: var(--ink-soft); font-family:'Space Mono', monospace;
    font-size: 13px; padding: 20px; opacity:.75;
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <span class="nav-logo">🎀 Ash's Big Day</span>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="card.html">Card</a>
        <a class="nav-link active" href="guestbook.html">Guestbook</a>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <div class="header">
      <h1>Leave Ash a Birthday Note 💌</h1>
      <div class="sub">// EVERYONE'S INVITED TO SIGN //</div>
    </div>

    <div class="form-card">
      <label for="noteName">Your name</label>
      <input type="text" id="noteName" maxlength="40" placeholder="e.g. Dada">
      <label for="noteMessage">Your message</label>
      <textarea id="noteMessage" maxlength="400" placeholder="Say happy birthday..."></textarea>
      <div class="form-actions">
        <button class="btn-primary" id="sendNoteBtn">Send love to Ash 💌</button>
      </div>
    </div>

    <div class="notes-wall" id="notesWall">
      <div class="empty-note">loading notes...</div>
    </div>
  </div>

  <footer class="site-footer">made with love (and a little help from AI) by Dada</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // ---- Paste your Firebase project's config here (see setup steps) ----
  const firebaseConfig = {
    apiKey: "AIzaSyCW0q9o1NVTjjfCPqWmLxCJ1QMmtxOEX0M",
    authDomain: "ash-birthday-f4131.firebaseapp.com",
    projectId: "ash-birthday-f4131",
    storageBucket: "ash-birthday-f4131.firebasestorage.app",
    messagingSenderId: "889085929664",
    appId: "1:889085929664:web:054783f67b8d1faacc6525"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const sendBtn = document.getElementById('sendNoteBtn');
  const nameInput = document.getElementById('noteName');
  const messageInput = document.getElementById('noteMessage');

  sendBtn.addEventListener('click', async () => {
    const who = (nameInput.value.trim() || "A friend").slice(0, 40);
    const what = messageInput.value.trim().slice(0, 400);
    if(!what){ messageInput.focus(); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";
    try {
      await db.collection('notes').add({
        who, what,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      nameInput.value = '';
      messageInput.value = '';
      sendBtn.textContent = "Sent! 🎉";
    } catch (err) {
      sendBtn.textContent = "Couldn't send — try again";
    } finally {
      setTimeout(() => { sendBtn.disabled = false; sendBtn.textContent = "Send love to Ash 💌"; }, 2200);
    }
  });

  const wall = document.getElementById('notesWall');
  db.collection('notes').orderBy('timestamp', 'desc').limit(100)
    .onSnapshot(snapshot => {
      wall.innerHTML = '';
      if(snapshot.empty){
        wall.innerHTML = '<div class="empty-note">no notes yet — be the first to leave one above 🎈</div>';
        return;
      }
      snapshot.forEach(doc => {
        const n = doc.data();
        const div = document.createElement('div');
        div.className = 'note';
        const whoEl = document.createElement('div');
        whoEl.className = 'who';
        whoEl.textContent = n.who || 'Someone';
        const whatEl = document.createElement('div');
        whatEl.className = 'what';
        whatEl.textContent = n.what || '';
        div.appendChild(whoEl);
        div.appendChild(whatEl);
        wall.appendChild(div);
      });
    }, err => {
      wall.innerHTML = '<div class="empty-note">notes aren\'t loading right now — check the Firebase setup</div>';
    });
</script>

</body>
</html>
